<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探照灯特效 - 密码验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  background:#111;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* 密码弹窗样式 */
.login-box{
  background:#222;
  padding:30px;
  border-radius:14px;
  text-align:center;
  color:white;
}
.login-box input{
  display:block;
  width:240px;
  margin:10px auto;
  padding:10px;
  font-size:16px;
}
.login-box button{
  padding:10px 20px;
  margin-top:8px;
  font-size:16px;
  cursor:pointer;
}
/* 探照灯页面，默认隐藏 */
.main-page{
  display:none;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
}
.content{
  font-size:40px;
  color:#fff;
  text-align:center;
  line-height:1.6;
}
.mask{
  position:fixed;
  inset:0;
  background:#000;
  pointer-events:none;
  mask:radial-gradient(circle 120px at var(--x) var(--y), transparent 0%, black 100%);
  -webkit-mask:radial-gradient(circle 120px at var(--x) var(--y), transparent 0%, black 100%);
}
</style>
</head>
<body>
<!-- 密码登录框 -->
<div class="login-box" id="login">
  <h2>🔐 请输入账号密码</h2>
  <input type="text" id="user" placeholder="账号">
  <input type="password" id="pwd" placeholder="密码">
  <button onclick="checkLogin()">进入</button>
</div>

<!-- 探照灯页面，验证成功才显示 -->
<div class="main-page" id="page">
  <div class="content">
赖泽盛是gay<br>
赖泽盛傻逼  </div>
  <div class="mask"></div>
</div>

<script>
// =========设置你的账号密码，下面会自动转base64=========
const rawUser = "admin";
const rawPwd = "lzsisgay";
// ======================================================
const USER_B64 = btoa(rawUser);
const PWD_B64 = btoa(rawPwd);

function checkLogin(){
  const inputUser = document.getElementById("user").value;
  const inputPwd = document.getElementById("pwd").value;
  if(btoa(inputUser) === USER_B64 && btoa(inputPwd) === PWD_B64){
    // 验证成功：隐藏登录框，显示探照灯页面
    document.getElementById("login").style.display = "none";
    document.getElementById("page").style.display = "flex";
  }else{
    alert("账号或密码错误！");
  }
}

//探照灯跟随鼠标
const mask = document.querySelector('.mask');
document.addEventListener('mousemove',e=>{
  if(mask){
    mask.style.setProperty('--x',e.clientX+'px');
    mask.style.setProperty('--y',e.clientY+'px');
  }
})
</script>
</body>
</html>
