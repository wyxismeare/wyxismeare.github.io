<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的相册</title>
    <style>
        body {
            padding: 20px;
            background-color: #f1f1f1;
        }
        h1 {
            text-align: center;
            color:#333;
        }
        /* 相册容器 */
        .album {
            display: flex;
            flex-wrap: wrap; /* 图片自动换行 */
            gap:15px; /* 图片之间空隙 */
            justify-content:center;
        }
        /* 图片样式 */
        .album img {
            width:220px;
            height:160px;
            object-fit: cover; /* 图片不变形 */
            border:4px solid #ffffff;
            border-radius:6px;
            box-shadow: 0 2px 8px #00000022;
        }
        /* 鼠标悬浮放大 */
        .album img:hover{
            transform: scale(1.05);
            transition:0.2s;
        }
    </style>
</head>
<body>
    <h1>我的相册</h1>
    <div class="album">
        <!-- 这里改src，填入你的图片文件名 -->
        <img src="1.jpg" alt="照片1">
        <img src="2.jpg" alt="照片2">
        <img src="3.jpg" alt="照片3">
        <img src="4.jpg" alt="照片4">
        <img src="5.jpg" alt="照片5">
    </div>
</body>
</html>
