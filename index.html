<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            padding: 24px;
            font-family: system-ui, sans-serif;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto‑fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .album-item {
            background:#2d2d2d;
            border-radius:10px;
            overflow:hidden;
            cursor:pointer;
            transition: transform 0.25s ease;
        }
        .album-item:hover {
            transform: scale(1.03);
        }
        .album-item img {
            width:100%;
            height:180px;
            object‑fit: cover;
            display:block;
        }
        .album-item p {
            padding:10px;
            text-align:center;
            font-size:14px;
        }
    </style>
</head>
<body>
    <h1>我的相册</h1>
    <div class="album-grid">
        <!-- 修改src填你的图片路径，本地图片直接写相对路径 -->
        <div class="album-item">
            <img src="./pic1.jpg" alt="照片1">
            <p>照片 01</p>
        </div>
        <div class="album-item">
            <img src="./pic2.jpg" alt="照片2">
            <p>照片 02</p>
        </div>
        <div class="album-item">
            <img src="./pic3.jpg" alt="照片3">
            <p>照片 03</p>
        </div>
    </div>
</body>
</html>
