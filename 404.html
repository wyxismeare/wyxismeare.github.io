<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 页面走失啦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{
    min-height:100vh;
    background:#111827;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}
@keyframes shake {
  0% {transform: rotate(-2deg);}
  50% {transform: rotate(2deg);}
  100% {transform: rotate(-2deg);}
}
.shake-text{
    font-size:8rem;
    font-weight:bold;
    color:#f87171;
    animation: shake 0.3s infinite;
}
.desc{
    font-size:22px;
    margin:16px 0 8px;
    color:#d1d5db;
}
.tip{
    color:#9ca3af;
    margin-bottom:32px;
}
.home-btn{
    padding:12px 24px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    text-decoration:none;
}
.home-btn:hover{
    background:#2563eb;
}
.cat{
    font-size:60px;
    margin-bottom:20px;
}
</style>
</head>
<body>
<div class="cat">🐱</div>
<div class="shake-text">404</div>
<div class="desc">糟糕！页面跑丢了</div>
<div class="tip">这个地址不存在，小猫找不到它啦</div>
<a href="/" class="home-btn">返回首页</a>
</body>
</html>
